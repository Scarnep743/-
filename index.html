<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #00d4ff;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .chat-box {
            background: #0f3460;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #00d4ff33;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #00d4ff22;
            border: 1px solid #00d4ff44;
            text-align: right;
            margin-left: 40px;
        }

        .bot-message {
            background: #53348333;
            border: 1px solid #53348366;
            margin-right: 40px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #00d4ff44;
            background: #0f3460;
            color: #e0e0e0;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #00d4ff;
        }

        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #00d4ff, #533483);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #ff444422;
            border: 1px solid #ff4444;
            color: #ff6b6b;
        }

        .warning {
            background: #ffaa0033;
            border: 1px solid #ffaa00;
            color: #ffaa00;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 DeepSeek Chat</h1>
        <p class="subtitle">Чат-бот на основе DeepSeek API</p>
        
        <div class="warning">
            ⚠️ ВАЖНО: Замените API_KEY в коде на свой ключ с <a href="https://platform.deepseek.com" target="_blank" style="color: #ffaa00;">platform.deepseek.com</a>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                👋 Привет! Я DeepSeek. Задайте мне любой вопрос.
            </div>
        </div>
        
        <div class="input-area">
            <textarea 
                id="userInput" 
                placeholder="Введите сообщение..." 
                rows="2"
                onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"
            ></textarea>
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // ⚠️ ЗАМЕНИТЕ ЭТОТ КЛЮЧ НА СВОЙ: https://platform.deepseek.com
        const API_KEY = "sk-a93f7e9c40e0484fa2446dae50690145";
        const API_URL = "https://api.deepseek.com/v1/chat/completions";

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message) return;
            
            if (API_KEY === "sk-ваш-ключ-здесь") {
                addMessage("❌ Ошибка: Сначала замените API_KEY в коде на реальный ключ!", 'error');
                return;
            }

            // Добавляем сообщение пользователя
            addMessage(message, 'user');
            userInput.value = '';
            
            // Показываем загрузку
            sendBtn.disabled = true;
            const loadingMsg = addMessage('<span class="loading"></span> Думаю...', 'bot', true);
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [
                            { 
                                role: "system", 
                                content: "Ты полезный ассистент. Отвечай на русском языке кратко и по делу." 
                            },
                            { role: "user", content: message }
                        ],
                        max_tokens: 1000,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // Удаляем сообщение загрузки
                loadingMsg.remove();
                
                if (response.ok && data.choices) {
                    const botReply = data.choices[0].message.content;
                    addMessage(botReply, 'bot');
                } else {
                    const errorMsg = data.error?.message || 'Неизвестная ошибка';
                    addMessage(`❌ Ошибка API: ${errorMsg}`, 'error');
                }
                
            } catch (error) {
                loadingMsg.remove();
                addMessage(`❌ Ошибка соединения: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, type, isTemp = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.innerHTML = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            if (isTemp) {
                return messageDiv;
            }
        }
    </script>
</body>
</html>
