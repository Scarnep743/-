<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Chat - DeepSeek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #00d4ff;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .model-selector {
            background: #0f3460;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #00d4ff33;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-selector label {
            color: #888;
            font-size: 14px;
            white-space: nowrap;
        }

        .model-selector select {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            background: #1a1a2e;
            color: #e0e0e0;
            border: 1px solid #00d4ff44;
            outline: none;
            font-size: 14px;
        }

        .chat-box {
            background: #0f3460;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #00d4ff33;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: #00d4ff22;
            border: 1px solid #00d4ff44;
            text-align: right;
            margin-left: 40px;
        }

        .bot-message {
            background: #53348333;
            border: 1px solid #53348366;
            margin-right: 40px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #00d4ff44;
            background: #0f3460;
            color: #e0e0e0;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #00d4ff;
        }

        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #00d4ff, #533483);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #ff444422;
            border: 1px solid #ff4444;
            color: #ff6b6b;
        }

        .info {
            background: #00d4ff22;
            border: 1px solid #00d4ff44;
            color: #00d4ff;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            margin-bottom: 10px;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffaa00;
        }

        .status-dot.online {
            background: #00ff88;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 OpenRouter Chat</h1>
        <p class="subtitle">DeepSeek через OpenRouter API</p>
        
        <div class="status">
            <span class="status-dot online" id="statusDot"></span>
            <span id="statusText">Готов к работе</span>
        </div>

        <div class="model-selector">
            <label>🧠 Модель:</label>
            <select id="modelSelect">
                <option value="deepseek/deepseek-chat">DeepSeek V3 (дешевле)</option>
                <option value="deepseek/deepseek-r1">DeepSeek R1 (умнее)</option>
            </select>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                👋 Привет! Выберите модель и задайте вопрос. Работает через OpenRouter.
            </div>
        </div>
        
        <div class="input-area">
            <textarea 
                id="userInput" 
                placeholder="Введите сообщение... (Enter - отправить, Shift+Enter - новая строка)" 
                rows="2"
                onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"
            ></textarea>
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
        
        <div class="stats">
            <span id="tokensUsed">Токены: 0</span>
            <span id="costEstimate">Стоимость: $0.00</span>
        </div>
    </div>

    <script>
        // 🔑 ВАШ КЛЮЧ OPENROUTER (удалите после теста!)
        const API_KEY = "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";
        const API_URL = "https://openrouter.ai/api/v1/chat/completions";

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const tokensUsed = document.getElementById('tokensUsed');
        const costEstimate = document.getElementById('costEstimate');

        let totalTokens = 0;
        let totalCost = 0;

        // Цены за 1M токенов (примерные)
        const prices = {
            'deepseek/deepseek-chat': { input: 0.14, output: 0.28 },
            'deepseek/deepseek-r1': { input: 0.55, output: 2.19 }
        };

        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            
            sendBtn.disabled = true;
            statusDot.className = 'status-dot';
            statusText.textContent = 'Думаю...';
            
            const loadingMsg = addMessage('<span class="loading"></span> Генерация ответа...', 'bot', true);
            
            try {
                const model = modelSelect.value;
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'OpenRouter Test'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: "user", content: message }
                        ],
                        max_tokens: 1000,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                loadingMsg.remove();
                
                if (response.ok && data.choices) {
                    const reply = data.choices[0].message.content;
                    addMessage(reply, 'bot');
                    
                    // Обновляем статистику
                    if (data.usage) {
                        totalTokens += data.usage.total_tokens;
                        tokensUsed.textContent = `Токены: ${totalTokens}`;
                        
                        // Примерный расчёт стоимости
                        const modelPrice = prices[model] || prices['deepseek/deepseek-chat'];
                        const inputCost = (data.usage.prompt_tokens / 1000000) * modelPrice.input;
                        const outputCost = (data.usage.completion_tokens / 1000000) * modelPrice.output;
                        totalCost += inputCost + outputCost;
                        costEstimate.textContent = `Стоимость: $${totalCost.toFixed(6)}`;
                    }
                    
                    statusDot.className = 'status-dot online';
                    statusText.textContent = 'Готов';
                } else if (response.status === 402) {
                    addMessage('❌ Недостаточно кредитов на OpenRouter. Пополните баланс.', 'error');
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Нет кредитов';
                } else if (response.status === 401) {
                    addMessage('❌ Неверный API ключ OpenRouter.', 'error');
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Ошибка ключа';
                } else {
                    const errorMsg = data.error?.message || 'Неизвестная ошибка';
                    addMessage(`❌ Ошибка: ${errorMsg}`, 'error');
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'Ошибка';
                }
            } catch (error) {
                loadingMsg.remove();
                addMessage(`❌ Ошибка соединения: ${error.message}`, 'error');
                statusDot.className = 'status-dot';
                statusText.textContent = 'Нет связи';
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, type, isTemp = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.innerHTML = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            if (isTemp) return messageDiv;
        }
    </script>
</body>
</html>
